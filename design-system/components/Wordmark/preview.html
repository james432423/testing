<!-- @dsCard group="Brand" height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Wordmark — preview</title>
<style>.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-8);padding:var(--space-8) var(--space-6)}.opt{display:grid;gap:var(--space-4);align-content:start}.opt small{font-size:12px;color:var(--ink-muted);line-height:17px}
.b{display:inline-flex;align-items:stretch;gap:12px;font-family:var(--font-sans);font-weight:700;font-size:72px;line-height:.9;letter-spacing:-.045em;color:var(--ink)}.b::before{content:"";width:6px;background:var(--brand);border-radius:2px}
.c{position:relative;display:inline-block;font-family:var(--font-sans);font-weight:700;font-size:72px;line-height:1;letter-spacing:-.045em;color:var(--ink);padding-bottom:12px}.c svg{position:absolute;left:-4px;right:-6px;bottom:0;width:calc(100% + 10px);height:16px;color:var(--brand)}.c path{fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round}</style></head>
<body>
<div class="opts">
<div class="opt"><span class="ida-mark ida-mark--lg" role="img" aria-label="Ida"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.5c2 1.2 3.6 3 4.8 5.2C11.6 12 15.4 7.2 20.5 4.2"/></svg>ıda</span><small>A · Default. The dot of the i is a hand-drawn tick in brand: the job is done.</small></div>
<div class="opt"><span class="b" role="img" aria-label="Ida">ida</span><small>B · The notebook's red margin line beside the name.</small></div>
<div class="opt"><span class="c" role="img" aria-label="Ida">ida<svg viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true"><path d="M3 11c40-5 92-8 150-5 14 1 30 2 44 4"/></svg></span><small>C · A signed-off underline stroke in brand.</small></div>
</div>
</body>
</html>
